aid: soria
name: Soria
description: >-
  Soria is an AI-native financial terminal built for healthcare investors. The
  platform aggregates financial data from 125+ public and private sources into
  continuously updated financial models and delivers them through a terminal UI,
  an MCP server, an API, warehouse sync, and a research feed. Soria targets
  bulge-bracket banks, boutique research firms, and the largest hedge funds that
  specialize in the healthcare sector, turning fragmented healthcare and life
  sciences data into live, analyst-ready models. Backed by Y Combinator. Its
  public surface is a single-page marketing site; the API and MCP delivery
  channels are gated to customers and are not publicly documented.
